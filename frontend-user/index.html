<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="植物大战僵尸网页游戏">
  <title>植物大战僵尸</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    /* 强制设置背景，防止任何闪动 */
    html {
      background: linear-gradient(
        135deg,
        #1a472a 0%,
        #2d5a3d 25%,
        #1e3a2f 50%,
        #0d2818 75%,
        #051a0f 100%
      ) !important;
      background-attachment: fixed !important;
    }
    
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      color: #ffffff !important;
      overflow: hidden;
    }
    
    #app {
      width: 100%;
      min-height: 100vh;
      background: transparent !important;
    }
    
    /* 防止白屏 */
    * {
      background-color: transparent;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
